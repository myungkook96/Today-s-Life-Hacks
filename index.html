<style>
/* Layout: 스레드처럼 640px 단일 피드 컬럼, 흑백 바탕에 오렌지 하나만 포인트 */
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --sunken:#f6f5f3;
  --line:#e8e5e1;
  --fg:#141211;
  --muted:#6e6862;
  --accent:#f2711c;
  --accent-ink:#b9500b;
  --accent-soft:#fff1e6;
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(20,18,17,.04),0 8px 24px rgba(20,18,17,.06);
  --font:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs-body:17.5px;
  --fs-small:15px;
  --fs-title:20px;
  --fs-hero:26px;
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f0f;--surface:#181818;--sunken:#1f1f1f;--line:#2c2a28;
    --fg:#f4f2ef;--muted:#a19a93;--accent:#ff8a3d;--accent-ink:#ffa064;
    --accent-soft:#2e1d10;--on-accent:#1a0f06;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f0f;--surface:#181818;--sunken:#1f1f1f;--line:#2c2a28;
  --fg:#f4f2ef;--muted:#a19a93;--accent:#ff8a3d;--accent-ink:#ffa064;
  --accent-soft:#2e1d10;--on-accent:#1a0f06;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font);font-size:var(--fs-body);line-height:1.7;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none}
.brand-mark{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;position:relative}
.brand-mark::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.brand-text{min-width:0}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:13px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;transition:background .15s}
.icon-btn:hover{background:var(--sunken)}
.icon-btn svg{width:24px;height:24px}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.badge{position:absolute;top:4px;right:2px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-weight:800;line-height:19px;text-align:center;font-variant-numeric:tabular-nums}
.badge[data-n="0"]{display:none}

/* Search */
.search{margin-top:18px;position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:54px;border-radius:999px;border:1px solid var(--line);background:var(--sunken);color:var(--fg);font:inherit;font-size:17px;padding:0 48px 0 48px;outline:none;transition:border-color .15s,background .15s}
.search input:focus{border-color:var(--fg);background:var(--surface)}
.search input::placeholder{color:var(--muted)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}

/* Today */
.section-label{font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px;margin:0}
.section-label .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.today{margin-top:26px;display:grid;gap:12px}
.today-card{background:var(--fg);color:var(--bg);border-radius:28px;padding:26px 24px 22px;cursor:pointer;display:grid;gap:14px;position:relative;overflow:hidden;text-align:left;width:100%}
.today-card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;opacity:.75}
.today-card .cat{background:var(--accent);color:var(--on-accent);opacity:1;font-weight:700;padding:3px 11px;border-radius:999px;font-size:13.5px}
.today-card h2{font-size:var(--fs-hero);line-height:1.35;letter-spacing:-.03em;margin:0;font-weight:800;text-wrap:balance}
.today-card .hook{font-size:18px;line-height:1.6;margin:0;opacity:.88}
.today-card .go{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:16px;color:var(--accent)}
.today-card .day{position:absolute;right:18px;top:12px;font-size:84px;font-weight:800;letter-spacing:-.05em;opacity:.08;line-height:1;font-variant-numeric:tabular-nums;pointer-events:none}

/* Tabs */
.tabs-wrap{margin-top:28px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);z-index:15;background:var(--bg);padding-block:10px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px))}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-right:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:42px;padding:0 17px;border-radius:999px;border:1px solid var(--line);font-size:16px;font-weight:600;color:var(--fg);background:var(--surface);white-space:nowrap;transition:all .15s}
.tab:hover{border-color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab .n{font-size:13px;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

/* Feed */
.feed-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:10px}
.feed-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.feed-head .count{font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.feed{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 10px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.post:hover{border-color:color-mix(in srgb,var(--muted) 45%,var(--line));box-shadow:var(--shadow)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:17px;position:relative}
.avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.post-main{min-width:0}
.post-meta{display:flex;align-items:center;gap:6px;font-size:15px;line-height:1.4;flex-wrap:wrap}
.post-meta .handle{font-weight:700}
.post-meta .when{color:var(--muted)}
.post h3{margin:6px 0 4px;font-size:var(--fs-title);line-height:1.4;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.post .body{margin:0;white-space:pre-line;color:var(--fg);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.post .more{color:var(--muted);font-size:15.5px;font-weight:600;margin-top:2px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:14px;line-height:1;padding:7px 11px;border-radius:999px;background:var(--sunken);color:var(--muted);font-weight:600}
.chip.cat{background:var(--accent-soft);color:var(--accent-ink)}
.actions{display:flex;align-items:center;gap:2px;margin-top:6px;margin-left:-10px}
.act{height:44px;min-width:44px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:14.5px;color:var(--muted);font-weight:600;transition:background .15s,color .15s}
.act:hover{background:var(--sunken);color:var(--fg)}
.act svg{width:22px;height:22px;flex:none}
.act.saved{color:var(--accent)}
.act.saved svg{fill:currentColor}
.empty{text-align:center;padding:48px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.empty strong{display:block;color:var(--fg);font-size:18px;margin-bottom:4px}

/* FAQ */
.faq{margin-top:48px}
.faq h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:10px 0 12px}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:16px 36px 16px 0;font-weight:700;font-size:17.5px;line-height:1.5;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:12px;font-size:26px;font-weight:400;color:var(--muted)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 16px;color:var(--muted)}

/* Footer */
.foot{margin-top:40px;padding-block:24px 150px;border-top:1px solid var(--line);color:var(--muted);font-size:14.5px;line-height:1.7}
.foot p{margin:0 0 6px}

/* CTA */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent))}
.cta a{max-width:608px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);text-decoration:none;border-radius:999px;padding:10px 10px 10px 20px;box-shadow:var(--shadow)}
.cta .txt{flex:1;min-width:0;line-height:1.35}
.cta .t1{font-size:13.5px;opacity:.7;display:block}
.cta .t2{font-weight:800;font-size:16.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta .btn{flex:none;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px;border-radius:999px;padding:11px 18px}

/* Detail sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92%;border-radius:28px 28px 0 0;background:var(--surface);color:var(--fg);overflow:hidden}
dialog.sheet::backdrop{background:rgba(10,9,8,.5)}
dialog.sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:28px;max-height:88%}}
.sheet-in{max-height:92dvh;overflow-y:auto;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-top{display:flex;align-items:center;gap:12px}
.sheet-top .post-meta{flex:1;min-width:0}
.sheet h2{font-size:24px;line-height:1.4;letter-spacing:-.03em;margin:16px 0 10px;font-weight:800;text-wrap:balance}
.sheet .full{white-space:pre-line;margin:0;font-size:18px;line-height:1.8}
.notice{margin-top:18px;background:var(--accent-soft);color:var(--fg);border-radius:16px;padding:14px 16px;font-size:15.5px;line-height:1.6;display:flex;gap:10px}
.notice svg{width:22px;height:22px;color:var(--accent-ink);flex:none;margin-top:1px}
.source{margin-top:12px;font-size:15px;color:var(--muted)}
.source b{color:var(--fg);font-weight:700}
.btn-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px}
.btn-sec{height:52px;border-radius:16px;background:var(--sunken);font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn-sec:hover{background:var(--line)}
.btn-sec svg{width:20px;height:20px;flex:none}
.btn-sec.saved{color:var(--accent)}
.btn-sec.saved svg{fill:currentColor}
.btn-primary{margin-top:10px;height:56px;border-radius:16px;background:var(--fg);color:var(--bg);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary svg{width:20px;height:20px}
.btn-share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kakao{background:#fee500;color:#191600}
.kakao:hover{background:#f5dc00}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:15.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  :root{--fs-hero:24px}
  .brand-sub{display:none}
  .act .lbl{display:none}
  .btn-sec{font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  moon: '<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>'
};

function fmtDate(d) {
  const [y, m, day] = d.split("-").map(Number);
  const diff = Math.round((new Date(todayStr()) - new Date(d)) / 86400000);
  if (diff === 0) return "오늘";
  if (diff === 1) return "어제";
  if (diff > 1 && diff < 7) return `${diff}일 전`;
  return `${y === new Date().getFullYear() ? "" : y + ". "}${m}월 ${day}일`;
}
function todayStr() {
  const k = new Date(Date.now() + 9 * 3600000); // 한국 시간 기준
  return k.toISOString().slice(0, 10);
}

/* ---------- 오늘의 꿀팁 (날짜 기준 순환) ---------- */
function renderToday() {
  const list = [...POSTS].sort((a, b) => a.id - b.id);
  const dayNum = Math.floor((Date.now() + 9 * 3600000) / 86400000);
  const p = list[dayNum % list.length];
  const [, m, d] = todayStr().split("-").map(Number);
  $("#todayDate").textContent = `${m}월 ${d}일 · 오늘의 꿀팁`;
  $("#todayCard").innerHTML = `
    <span class="day" aria-hidden="true">${String(d).padStart(2, "0")}</span>
    <span class="meta"><span class="cat">${esc(p.category)}</span><span>@${esc(CONFIG.handle)}</span></span>
    <h2>${esc(p.title)}</h2>
    <p class="hook">${esc(firstLine(p))}</p>
    <span class="go">자세히 보기 ${ICON.out.replace('<svg', '<svg width="18" height="18"')}</span>`;
  $("#todayCard").onclick = () => openDetail(p.id);
}

/* ---------- 탭 ---------- */
function renderTabs() {
  const counts = Object.fromEntries(CATEGORIES.map(c => [c, POSTS.filter(p => p.category === c).length]));
  $("#tabs").innerHTML = ["전체", ...CATEGORIES].map(c => `
    <button class="tab" role="tab" aria-selected="${!state.savedOnly && state.cat === c}" data-cat="${esc(c)}">
      ${esc(c)}<span class="n">${c === "전체" ? POSTS.length : counts[c]}</span>
    </button>`).join("");
}

/* ---------- 피드 ---------- */
function filtered() {
  const q = state.q.trim().toLowerCase().replace(/^#/, "");
  return sorted().filter(p => {
    if (state.savedOnly && !saved.has(p.id)) return false;
    if (!state.savedOnly && state.cat !== "전체" && p.category !== state.cat) return false;
    if (!q) return true;
    return [p.title, p.body, p.category, ...p.tags].join(" ").toLowerCase().includes(q);
  });
}

function postCard(p) {
  const isSaved = saved.has(p.id);
  return `
  <li class="post" data-id="${p.id}" tabindex="0" aria-label="${esc(p.title)}">
    <div class="avatar" aria-hidden="true">${esc(CONFIG.avatarText)}</div>
    <div class="post-main">
      <div class="post-meta"><span class="handle">${esc(CONFIG.handle)}</span><span class="when">· ${fmtDate(p.date)}</span></div>
      <h3>${esc(p.title)}</h3>
      <p class="body">${esc(p.body)}</p>
      <span class="more">더 보기</span>
      <div class="chips">
        <span class="chip cat">${esc(p.category)}</span>
        ${p.tags.slice(0, 3).map(t => `<span class="chip">#${esc(t)}</span>`).join("")}
      </div>
      <div class="actions">
        <button class="act ${isSaved ? "saved" : ""}" data-act="save" aria-pressed="${isSaved}" aria-label="저장">${ICON.heart}<span class="lbl">${isSaved ? "저장됨" : "저장"}</span></button>
        <button class="act" data-act="copy" aria-label="본문 복사">${ICON.copy}<span class="lbl">복사</span></button>
        <button class="act" data-act="share" aria-label="공유">${ICON.share}<span class="lbl">공유</span></button>
      </div>
    </div>
  </li>`;
}

function renderFeed() {
  const list = filtered();
  const title = state.savedOnly ? "내 저장함" : state.cat === "전체" ? "전체 글" : state.cat;
  $("#feedTitle").textContent = state.q ? `'${state.q}' 검색 결과` : title;
  $("#feedCount").textContent = `${list.length}개`;
  $("#todaySec").hidden = !!state.q || state.savedOnly;
  if (!list.length) {
    $("#feed").innerHTML = state.savedOnly && !state.q
      ? `<li class="empty"><strong>아직 저장한 글이 없어요</strong>마음에 드는 글의 하트를 누르면 여기에 모여요.</li>`
      : `<li class="empty"><strong>찾는 글이 없어요</strong>다른 단어로 검색하거나 '전체' 탭을 눌러 보세요.</li>`;
    return;
  }
  $("#feed").innerHTML = list.map(postCard).join("");
}

function renderSavedCount() {
  const n = saved.size;
  const b = $("#savedCount");
  b.textContent = n; b.dataset.n = n;
  $("#savedBtn").setAttribute("aria-pressed", state.savedOnly);
}

function renderAll() { renderTabs(); renderFeed(); renderSavedCount(); }

/* ---------- FAQ + 구조화 데이터 ---------- */
function renderFaq() {
  const list = sorted();
  $("#faqList").innerHTML = list.map(p => `
    <details><summary>${esc(p.title)}</summary><p>${esc(firstLine(p))}${p.source ? ` (출처: ${esc(p.source)})` : ""}</p></details>`).join("");

  const ld = [
    { "@context": "https://schema.org", "@type": "WebSite", name: CONFIG.brand, description: CONFIG.tagline, inLanguage: "ko-KR", url: baseUrl() },
    { "@context": "https://schema.org", "@type": "FAQPage",
      mainEntity: list.map(p => ({ "@type": "Question", name: p.title,
        acceptedAnswer: { "@type": "Answer", text: p.body.replace(/\n+/g, " ").trim() } })) }
  ];
  const s = document.createElement("script");
  s.type = "application/ld+json";
  s.textContent = JSON.stringify(ld);
  document.head.appendChild(s);
}

/* ---------- 상세 보기 ---------- */
const sheet = $("#sheet");
function openDetail(id) {
  const p = POSTS.find(x => x.id === id);
  if (!p) return;
  const isSaved = saved.has(p.id);
  $("#sheetIn").innerHTML = `
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-top">
      <div class="avatar" aria-hidden="true">${esc(CONFIG.avatarText)}</div>
      <div class="post-meta"><span class="handle">${esc(CONFIG.handle)}</span><span class="when">· ${fmtDate(p.date)}</span></div>
      <button class="icon-btn" data-act="close" aria-label="닫기">${ICON.close}</button>
    </div>
    <h2 id="sheetTitle">${esc(p.title)}</h2>
    <p class="full">${esc(p.body)}</p>
    <div class="chips">
      <span class="chip cat">${esc(p.category)}</span>
      ${p.tags.map(t => `<span class="chip">#${esc(t)}</span>`).join("")}
    </div>
    ${needsNotice(p) ? `<div class="notice">${ICON.info}<span>정확한 내용은 공식 기관에서 확인하세요. 제도와 기준은 바뀔 수 있어요.</span></div>` : ""}
    ${p.source ? `<p class="source">출처 · <b>${esc(p.source)}</b></p>` : ""}
    <div class="btn-row">
      <button class="btn-sec ${isSaved ? "saved" : ""}" data-act="save" aria-pressed="${isSaved}">${ICON.heart}${isSaved ? "저장됨" : "저장"}</button>
      <button class="btn-sec" data-act="copy">${ICON.copy}본문 복사</button>
      <button class="btn-sec" data-act="link">${ICON.link}링크 복사</button>
    </div>
    <div class="btn-share">
      <button class="btn-sec kakao" data-act="kakao">카카오톡 공유</button>
      <button class="btn-sec" data-act="share">${ICON.share}다른 앱 공유</button>
    </div>
    <a class="btn-primary" href="${esc(postUrl(p))}" target="_blank" rel="noopener">스레드 원문 보기 ${ICON.out}</a>`;
  sheet.dataset.id = p.id;
  if (!sheet.open) sheet.showModal();
  $("#sheetIn").scrollTop = 0;
}
sheet.addEventListener("click", e => {
  if (e.target === sheet) return sheet.close();
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const p = POSTS.find(x => x.id === Number(sheet.dataset.id));
  handleAct(btn.dataset.act, p, () => openDetail(p.id));
});

/* ---------- 버튼 동작 ---------- */
function handleAct(act, p, rerender) {
  if (act === "close") return sheet.close();
  if (act === "save") {
    saved.has(p.id) ? saved.delete(p.id) : saved.add(p.id);
    store.set("lt_saved", [...saved]);
    toast(saved.has(p.id) ? "내 저장함에 담았어요" : "저장을 취소했어요");
    renderAll(); rerender && rerender();
  }
  if (act === "copy") copyText(`${p.body}\n\n${p.tags.map(t => "#" + t).join(" ")}`, "본문을 복사했어요");
  if (act === "link") copyText(shareUrl(p), "링크를 복사했어요");
  if (act === "kakao") shareKakao(p);
  if (act === "share") shareNative(p);
}

function copyText(text, msg) {
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    (sheet.open ? sheet : document.body).appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    toast(ok ? msg : "복사가 막혀 있어요. 길게 눌러 직접 복사해 주세요");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast(msg), fallback);
  } else fallback();
}

function shareKakao(p) {
  if (window.Kakao && Kakao.isInitialized && Kakao.isInitialized()) {
    Kakao.Share.sendDefault({
      objectType: "feed",
      content: { title: p.title, description: firstLine(p), imageUrl: CONFIG.ogImage,
        link: { mobileWebUrl: shareUrl(p), webUrl: shareUrl(p) } },
      buttons: [{ title: "자세히 보기", link: { mobileWebUrl: shareUrl(p), webUrl: shareUrl(p) } }]
    });
    return;
  }
  copyText(`[${CONFIG.brand}] ${p.title}\n${shareUrl(p)}`, "링크를 복사했어요. 카카오톡 대화창에 붙여넣어 보내세요");
}

function shareNative(p) {
  const data = { title: p.title, text: firstLine(p), url: shareUrl(p) };
  if (navigator.share) navigator.share(data).catch(err => { if (err.name !== "AbortError") copyText(shareUrl(p), "링크를 복사했어요"); });
  else copyText(shareUrl(p), "링크를 복사했어요");
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- 다크모드 ---------- */
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeIcon").innerHTML = dark ? ICON.sun : ICON.moon;
  $("#themeBtn").setAttribute("aria-label", dark ? "라이트모드로 전환" : "다크모드로 전환");
}
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  store.set("lt_theme", next); applyTheme(next);
};

/* ---------- 이벤트 ---------- */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.cat = b.dataset.cat; state.savedOnly = false;
  renderAll();
  b.scrollIntoView({ inline: "nearest", block: "nearest", behavior: "smooth" });
});
$("#feed").addEventListener("click", e => {
  const card = e.target.closest(".post"); if (!card) return;
  const p = POSTS.find(x => x.id === Number(card.dataset.id));
  const btn = e.target.closest("[data-act]");
  if (btn) { e.stopPropagation(); return handleAct(btn.dataset.act, p); }
  openDetail(p.id);
});
$("#feed").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("post")) openDetail(Number(e.target.dataset.id));
});
$("#q").addEventListener("input", e => {
  state.q = e.target.value;
  $("#clearQ").hidden = !state.q;
  renderFeed();
});
$("#clearQ").onclick = () => { $("#q").value = ""; state.q = ""; $("#clearQ").hidden = true; renderFeed(); $("#q").focus(); };
$("#savedBtn").onclick = () => {
  state.savedOnly = !state.savedOnly;
  renderAll();
  $("#feedTitle").scrollIntoView({ behavior: "smooth", block: "center" });
};
$("#homeLink").onclick = e => {
  e.preventDefault();
  Object.assign(state, { cat: "전체", q: "", savedOnly: false });
  $("#q").value = ""; $("#clearQ").hidden = true;
  renderAll(); scrollTo({ top: 0, behavior: "smooth" });
};

/* ---------- 시작 ---------- */
(function init() {
  $("#brandName").textContent = CONFIG.brand;
  $("#brandSub").textContent = CONFIG.tagline;
  $("#brandMark").textContent = CONFIG.avatarText;
  $("#ctaHandle").textContent = `@${CONFIG.handle} 팔로우`;
  $("#ctaLink").href = profileUrl();
  $("#footBrand").textContent = `© ${new Date().getFullYear()} ${CONFIG.brand} · 스레드 @${CONFIG.handle}`;
  applyTheme(store.get("lt_theme", null));
  renderToday(); renderAll(); renderFaq();

  const m = location.hash.match(/^#p(\d+)$/);
  if (m) openDetail(Number(m[1]));

  if (CONFIG.kakaoJsKey) {
    const s = document.createElement("script");
    s.src = "https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js";
    s.onload = () => { try { Kakao.init(CONFIG.kakaoJsKey); } catch {} };
    document.head.appendChild(s);
  }
})();
</script>

</body></html>
